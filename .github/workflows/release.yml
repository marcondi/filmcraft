name: Release Windows x64

on:
  push:
    branches: [main, release]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, e.g. 0.14.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WiX toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Package Windows x64
        shell: pwsh
        env:
          FILMCRAFT_VERSION: ${{ inputs.version }}
          CARGO_FEATURES: whisper
        run: |
          pwsh packaging/windows/package.ps1 -Arch x64

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
            target/x86_64-pc-windows-msvc/release/filmcraft.exe
            target/x86_64-pc-windows-msvc/release/filmcraft-cli.exe
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FilmCraft ${{ github.ref_name }} (Windows x64)
          draft: false
          prerelease: false
          files: |
            dist/release/*.msi
            dist/release/*.zip
            target/x86_64-pc-windows-msvc/release/filmcraft.exe
            target/x86_64-pc-windows-msvc/release/filmcraft-cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
